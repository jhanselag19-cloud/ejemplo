{% extends "almacen/base.html" %}

{% block title %}Contraseña actualizada - Nexo{% endblock %}
{% block breadcrumb %}Contraseña actualizada{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white rounded-xl border border-gray-200 p-8 text-center">
    <div class="w-14 h-14 bg-teal-50 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="check-circle" class="w-7 h-7 text-teal-600"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-1">¡Contraseña actualizada!</h1>
    <p class="text-sm text-gray-500 mb-6">Tu contraseña se cambió correctamente.</p>

    <a href="{% url 'almacen:home' %}"
       class="inline-block px-5 py-2.5 bg-teal-700 text-white rounded-lg text-sm font-medium hover:bg-teal-800 transition">
        Volver al inicio
    </a>
</div>
{% endblock %}
